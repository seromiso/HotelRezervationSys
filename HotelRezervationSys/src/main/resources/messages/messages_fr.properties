# Messages généraux
error.resource.not.found=L’enregistrement demandé est introuvable.
error.invalid.request=Les informations fournies ne sont pas valides.
error.conflict=L’opération n’a pas pu être effectuée en raison de l’état actuel.
error.type.mismatch=L’un des paramètres fournis n’est pas valide.
error.internal.server=Une erreur inattendue s’est produite lors du traitement de votre demande. Veuillez réessayer plus tard.

# Ressources
error.booking.not.found=La réservation est introuvable.
error.user.not.found=L’utilisateur est introuvable.
error.hotel.not.found=L’hôtel sélectionné est introuvable.
error.room.type.not.found=Le type de chambre sélectionné est introuvable.

# Validations de réservation
error.booking.invalid.selection=Les informations relatives à l’hôtel ou à la chambre sélectionnée ne sont pas valides.
error.booking.dates.required=Veuillez sélectionner les dates d’arrivée et de départ.
error.booking.checkin.past=La date d’arrivée ne peut pas être antérieure à la date actuelle.
error.booking.invalid.date.range=La date de départ doit être postérieure à la date d’arrivée.
error.booking.adult.required=Au moins un adulte doit être sélectionné pour la réservation.
error.booking.child.count.negative=Le nombre d’enfants ne peut pas être négatif.
error.booking.capacity.exceeded=Le nombre de personnes dépasse la capacité de la chambre sélectionnée.
error.booking.guest.required=Les informations d’au moins un client doivent être fournies.
error.booking.guest.count.mismatch=Les informations fournies sur les clients ne correspondent pas au nombre de personnes sélectionné.
error.booking.primary.guest.invalid=Un seul client principal doit être sélectionné.

# Conflits de réservation
error.booking.room.unavailable=La chambre sélectionnée n’est actuellement pas disponible à la réservation.
error.booking.no.availability=Aucune chambre n’est disponible pour les dates sélectionnées.
error.booking.price.not.found=Aucune information tarifaire n’a été trouvée pour les dates sélectionnées.

error.favorites.allready=Cet hôtel fait déjà partie de vos favoris !
error.favorites.no.favorites.found=Aucun favori à supprimer !
error.payment.not.found=Paiement introuvable.
error.payment.not.allowed=Le paiement ne peut pas être effectué pour cette réservation.

error.hotel.review.not.found=L’avis de l’hôtel est introuvable.
error.hotel.review.already.exists=Un avis existe déjà pour cette réservation.

error.feature.not.found=La fonctionnalité est introuvable.
error.room.type.feature.not.found=La relation entre le type de chambre et la fonctionnalité est introuvable.
error.room.type.feature.already.exists=Cette fonctionnalité est déjà ajoutée à ce type de chambre.
error.room.type.feature.only.room.allowed=Seules les fonctionnalités de type ROOM peuvent être ajoutées aux types de chambre.

error.feature.id.required=L’identifiant de la fonctionnalité est obligatoire.
error.hotel.feature.not.found=La relation entre l’hôtel et la fonctionnalité est introuvable.
error.hotel.feature.already.exists=Cette fonctionnalité est déjà ajoutée à cet hôtel.
error.hotel.feature.only.hotel.allowed=Seules les fonctionnalités de type HOTEL peuvent être ajoutées aux hôtels.

# Erreurs d'Image et de Catégorie
error.category.not.found=La catégorie d'image sélectionnée est introuvable.
error.hotel.image.not.found=L'image sélectionnée est introuvable.
error.hotel.image.unauthorized=Vous n'êtes pas autorisé à modifier les images de cet hôtel.
error.hotel.image.mismatch=Cette image n'appartient pas à l'hôtel sélectionné.