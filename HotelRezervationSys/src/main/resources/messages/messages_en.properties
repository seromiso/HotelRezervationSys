# Generic messages
error.resource.not.found=The requested record was not found.
error.invalid.request=The provided information is invalid.
error.conflict=The operation could not be completed due to the current state.
error.type.mismatch=One of the provided parameters is invalid.
error.internal.server=An unexpected error occurred while processing your request. Please try again later.

# Resources
error.booking.not.found=Booking not found.
error.user.not.found=User not found.
error.hotel.not.found=The selected hotel was not found.
error.room.type.not.found=The selected room type was not found.

# Booking validations
error.booking.invalid.selection=The selected hotel or room information is invalid.
error.booking.dates.required=Please select check-in and check-out dates.
error.booking.checkin.past=The check-in date cannot be in the past.
error.booking.invalid.date.range=The check-out date must be after the check-in date.
error.booking.adult.required=At least one adult must be selected for the booking.
error.booking.child.count.negative=The number of children cannot be negative.
error.booking.capacity.exceeded=The number of guests exceeds the capacity of the selected room.
error.booking.guest.required=At least one guest's information must be provided.
error.booking.guest.count.mismatch=The provided guest information does not match the selected number of guests.
error.booking.primary.guest.invalid=Exactly one primary guest must be selected.
error.booking.reservation.required=At least one room reservation must be selected.
error.booking.multiple.hotels.not.allowed=Rooms from only one hotel can be selected within the same booking.
error.room.price.not.found=No price information was found for the selected dates.
error.booking.insufficient.room.availability=There are not enough available rooms for the requested reservation.

# Booking conflicts
error.booking.room.unavailable=The selected room is currently unavailable for booking.
error.booking.no.availability=No rooms are available for the selected dates.
error.booking.price.not.found=No pricing information was found for the selected dates.

error.favorites.allready=This hotel is already among your favorites!
error.favorites.no.favorites.found=No favorites found to delete!
error.payment.not.found=Payment not found.
error.payment.not.allowed=Payment cannot be made for this booking.

