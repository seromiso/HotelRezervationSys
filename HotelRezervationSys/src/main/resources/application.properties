spring.application.name=HotelRezervationSys

spring.flyway.enabled=true

# 1. PostgreSQL Bağlantı Ayarları
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hoteldb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123654}
spring.datasource.driver-class-name=org.postgresql.Driver
# 2. Hibernate / JPA Ayarları
# Hibernate otomatik tablo açmasın, Flyway'in kurduğu şemayı sadece valide (kontrol) etsin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Konsolda sql sorgularını temizce görmek
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Flyway Ayarları
# Eğer veritabanınızda önceden kalma tablolar varsa Flyway hata vermesin diye:
spring.flyway.baseline-on-migrate=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
